name: forex-prices

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 12:00 ظهراً بتوقيت تركيا
    - cron: '0 15 * * 1-5'  # 6:00 مساءً بتوقيت تركيا
  workflow_dispatch:

jobs:
  post-forex-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python forex_price_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
